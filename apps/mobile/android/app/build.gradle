import java.util.Properties

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// The release signing key: android/key.properties (never committed) names a keystore, see the README. Without it a release build is
// signed with the debug key, so `flutter run --release` and CI keep working.
def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file("key.properties")
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withInputStream { keyProperties.load(it) }
}

android {
    namespace = "com.spacefly.spacefly_mobile"
    compileSdk = 36 // the newest plugins (androidx.browser 1.9) need 36; targetSdk stays with Flutter
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.spacefly.spacefly_mobile"
        minSdk = 24 // flutter_secure_storage and flutter_web_auth_2 need 23+
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keyPropertiesFile.exists()) {
                keyAlias = keyProperties["keyAlias"]
                keyPassword = keyProperties["keyPassword"]
                storeFile = file(keyProperties["storeFile"])
                storePassword = keyProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keyPropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
