<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <style>
      html,
      body,
      #chart {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="chart"></div>
    <script src="echarts.min.js"></script>
    <script>
      // window.sfHydrate is injected by the app (libs/client/src/charts/portable.ts) right after this page loads.
      var chart = null;
      var themeJson = null;
      window.addEventListener('resize', function () {
        if (chart) chart.resize();
      });
      // ECharts bakes a theme in at init, so a theme change disposes the chart and creates it again.
      window.sfRender = function (option, theme) {
        var json = JSON.stringify(theme);
        if (chart && json !== themeJson) {
          chart.dispose();
          chart = null;
        }
        if (!chart) {
          themeJson = json;
          echarts.registerTheme('spacefly', theme);
          chart = echarts.init(document.getElementById('chart'), 'spacefly');
          chart.on('click', function (p) {
            window.nsWebViewBridge.emit('chartClick', { dataIndex: p.dataIndex, name: p.name });
          });
        }
        chart.setOption(window.sfHydrate(option), true);
      };
    </script>
  </body>
</html>
